mcc: '901'
mnc: '70'
nci: '0x000000010'
idLength: 32
tac: 1

# gNB sử dụng IP tĩnh 172.20.1.10
linkIp: 172.20.1.10
ngapIp: 172.20.1.10
gtpIp: 172.20.1.10

# AMF configuration - kết nối tới AMF IP tĩnh
amfConfigs:
  - address: 172.20.0.20
    port: 38412

# Hỗ trợ 2 slices: eMBB, URLLC
slices:
  - sst: 1  # eMBB - Enhanced Mobile Broadband
    sd: 0x000001
  - sst: 2  # URLLC - Ultra-Reliable Low-Latency
    sd: 0x000002

ignoreStreamIds: true
