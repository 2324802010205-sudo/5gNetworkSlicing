---
source: config/amf.yaml
content: |
  amf:
    amf_name: open5gs-amf
    sbi:
      server:
        - dev: eth0
          port: 7777
      client:
        nrf:
          - uri: http://nrf:7777
        nssf:
          - uri: http://nssf:7777
    ngap:
      server:
        - dev: eth0
    metrics:
      server:
        - dev: eth0
          port: 9090
    guami:
      - plmn_id:
          mcc: 901
          mnc: 70
        amf_id:
          region: 2
          set: 1
    tai:
      - plmn_id:
          mcc: 901
          mnc: 70
        tac: 1
    plmn_support:
      - plmn_id:
          mcc: 901
          mnc: 70
        s_nssai:
          - sst: 1  # eMBB
            sd: 0x000001
          - sst: 2  # URLLC
            sd: 0x000002
    security:
      integrity_order:
        - NIA2
        - NIA1
        - NIA0
      ciphering_order:
        - NEA2
        - NEA1
        - NEA0
    network_name:
      full: Open5GS
      short: Next
    amf_name: open5gs-amf
    time:
      t3502:
        value: 720
      t3512:
        value: 540
    logger:
      level: info

---
source: config/ausf.yaml
content: |
  ausf:
    sbi:
      server:
        - dev: eth0
          port: 7777
      client:
        nrf:
          - uri: http://nrf:7777
    logger:
      level: info

---
source: config/nrf.yaml
content: |
  nrf:
    sbi:
      server:
        - dev: eth0
          port: 7777
    logger:
      level: info

---
source: config/nssf.yaml
content: |
  nssf:
    sbi:
      server:
        - dev: eth0
          port: 7777
      client:
        nrf:
          - uri: http://nrf:7777
        nsi:
          - uri: http://nrf:7777
            s_nssai:
              sst: 1
              sd: 000001
          - uri: http://nrf:7777
            s_nssai:
              sst: 2
              sd: 000002
    nsi:
      - uri: http://nrf:7777
        s_nssai:
          sst: 1
          sd: 000001
        tai:
          plmn_id:
            mcc: 901
            mnc: 70
          tac: 1
      - uri: http://nrf:7777
        s_nssai:
          sst: 2
          sd: 000002
        tai:
          plmn_id:
            mcc: 901
            mnc: 70
          tac: 1
    logger:
      level: info

---
source: config/pcf.yaml
content: |
  pcf:
    sbi:
      server:
        - dev: eth0
          port: 7777
      client:
        nrf:
          - uri: http://nrf:7777
    metrics:
      server:
        - dev: eth0
          port: 9090
    policy:
      - plmn_id:
          mcc: 901
          mnc: 70
        slice:
          - sst: 1
            sd: 0x000001
            default_indicator: true
            session:
              - name: internet
                type: 3
                qos:
                  index: 9
                  arp:
                    priority_level: 8
                    pre_emption_capability: 1
                    pre_emption_vulnerability: 1
                ambr:
                  downlink:
                    value: 200
                    unit: 2
                  uplink:
                    value: 100
                    unit: 2
          - sst: 2
            sd: 0x000002
            session:
              - name: internet2
                type: 3
                qos:
                  index: 82
                  arp:
                    priority_level: 2
                    pre_emption_capability: 1
                    pre_emption_vulnerability: 2
                ambr:
                  downlink:
                    value: 50
                    unit: 2
                  uplink:
                    value: 50
                    unit: 2

---
source: config/prometheus.yml
content: |
  global:
    scrape_interval: 15s
    evaluation_interval: 15s
    external_labels:
      monitor: '5g-network-monitor'
  
  scrape_configs:
    - job_name: 'node-exporter'
      static_configs:
        - targets: ['node-exporter:9100']
          labels:
            group: 'infrastructure'
  
    - job_name: 'cadvisor'
      static_configs:
        - targets: ['cadvisor:8080']
          labels:
            group: 'containers'
  
    - job_name: 'amf'
      static_configs:
        - targets: ['amf:9090']
          labels:
            group: '5g-core'
            function: 'amf'
  
    - job_name: 'smf'
      static_configs:
        - targets: ['smf:9090']
          labels:
            group: '5g-core'
            function: 'smf'
  
    - job_name: 'upf-embb'
      static_configs:
        - targets: ['upf-embb:9090']
          labels:
            group: '5g-upf'
            slice: 'embb'
  
    - job_name: 'upf-urllc'
      static_configs:
        - targets: ['upf-urllc:9090']
          labels:
            group: '5g-upf'
            slice: 'urllc'
  
    - job_name: 'pcf'
      static_configs:
        - targets: ['pcf:9090']
          labels:
            group: '5g-core'
            function: 'pcf'
    - job_name: 'pushgateway'
      honor_labels: true
      static_configs:
        - targets: ['pushgateway:9091']
          labels:
            group: '5g-upf-metrics'

