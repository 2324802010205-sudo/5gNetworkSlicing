source: config/smf.yaml
content: |
  smf:
    sbi:
      server:
        - dev: eth0
          port: 7777
      client:
        nrf:
          - uri: http://nrf:7777
    pfcp:
      server:
        - dev: eth0
      client:
        upf:
          - address: upf-embb
            dnn: internet
          - address: upf-urllc
            dnn: internet2
    gtpc:
      server:
        - dev: eth0
    gtpu:
      server:
        - dev: eth0
    metrics:
      server:
        - dev: eth0
          port: 9090
    session:
      - subnet: 10.45.0.0/16
        gateway: 10.45.0.1
        dnn: internet
      - subnet: 10.46.0.0/16
        gateway: 10.46.0.1
        dnn: internet2
    dns:
      - 8.8.8.8
      - 8.8.4.4
    mtu: 1400
    ctf:
      enabled: auto
    info:
      - s_nssai:
          - sst: 1
            sd: 000001
            dnn:
              - internet
          - sst: 2
            sd: 000002
            dnn:
