x-open5gs-image: &open5gs_image gradiant/open5gs:2.7.5
x-ueransim-image: &ueransim_image gradiant/ueransim:3.2.6
x-restart-policy: &restart_policy "${RESTART_POLICY:-on-failure:3}"

networks:
  br-5gcore:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

services:
  mongo:
    image: mongo:6-jammy
    container_name: mongo
    profiles: ["core"]
    restart: *restart_policy
    mem_limit: 768m
    cpus: 0.40
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.30"]
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.5
    volumes:
      - ./mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' mongodb://127.0.0.1:27017/admin | grep -q 1"]
      interval: 10s
      timeout: 20s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 768M

  nrf:
    image: *open5gs_image
    container_name: nrf
    profiles: ["core"]
    mem_limit: 96m
    cpus: 0.15
    command: open5gs-nrfd -c /opt/open5gs/etc/open5gs/nrf.yaml
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.10
    volumes:
      - ./config/nrf.yaml:/opt/open5gs/etc/open5gs/nrf.yaml:ro
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 96M

  nssf:
    image: *open5gs_image
    container_name: nssf
    profiles: ["core"]
    mem_limit: 96m
    cpus: 0.15
    command: open5gs-nssfd -c /opt/open5gs/etc/open5gs/nssf.yaml
    depends_on:
      - nrf
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.15
    volumes:
      - ./config/nssf.yaml:/opt/open5gs/etc/open5gs/nssf.yaml:ro
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 96M

  amf:
    image: *open5gs_image
    container_name: amf
    profiles: ["core"]
    mem_limit: 192m
    cpus: 0.25
    command: open5gs-amfd -c /opt/open5gs/etc/open5gs/amf.yaml
    depends_on:
      - nrf
      - nssf
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.20
    volumes:
      - ./config/amf.yaml:/opt/open5gs/etc/open5gs/amf.yaml:ro
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M

  smf:
    image: *open5gs_image
    container_name: smf
    profiles: ["core"]
    mem_limit: 192m
    cpus: 0.25
    command: open5gs-smfd -c /opt/open5gs/etc/open5gs/smf.yaml
    depends_on:
      - nrf
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.30
    volumes:
      - ./config/smf.yaml:/opt/open5gs/etc/open5gs/smf.yaml:ro
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M

  ausf:
    image: *open5gs_image
    container_name: ausf
    profiles: ["core"]
    mem_limit: 96m
    cpus: 0.10
    command: open5gs-ausfd -c /opt/open5gs/etc/open5gs/ausf.yaml
    depends_on:
      - nrf
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.40
    volumes:
      - ./config/ausf.yaml:/opt/open5gs/etc/open5gs/ausf.yaml:ro
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 96M

  udm:
    image: *open5gs_image
    container_name: udm
    profiles: ["core"]
    mem_limit: 96m
    cpus: 0.10
    command: open5gs-udmd -c /opt/open5gs/etc/open5gs/udm.yaml
    depends_on:
      - nrf
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.50
    volumes:
      - ./config/udm.yaml:/opt/open5gs/etc/open5gs/udm.yaml:ro
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 96M

  udr:
    image: *open5gs_image
    container_name: udr
    profiles: ["core"]
    mem_limit: 128m
    cpus: 0.15
    command: open5gs-udrd -c /opt/open5gs/etc/open5gs/udr.yaml
    depends_on:
      - mongo
      - nrf
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.60
    volumes:
      - ./config/udr.yaml:/opt/open5gs/etc/open5gs/udr.yaml:ro
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M

  pcf:
    image: *open5gs_image
    container_name: pcf
    profiles: ["core"]
    mem_limit: 96m
    cpus: 0.10
    command: open5gs-pcfd -c /opt/open5gs/etc/open5gs/pcf.yaml
    depends_on:
      - nrf
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.70
    volumes:
      - ./config/pcf.yaml:/opt/open5gs/etc/open5gs/pcf.yaml:ro
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 96M

  upf-embb:
    image: *open5gs_image
    container_name: upf-embb
    profiles: ["core"]
    mem_limit: 384m
    cpus: 0.50
    user: root
    entrypoint: ["/bin/bash", "/scripts/upf-embb-start.sh"]
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - IPV4_TUN_ADDR=10.45.0.1/16
      - IPV4_TUN_SUBNET=10.45.0.0/16
      - IPV6_TUN_ADDR=cafe::1/64
      - ENABLE_NAT=true
      - OGSTUN_TXQUEUELEN=4096
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.100
    volumes:
      - ./config/upf-embb.yaml:/opt/open5gs/etc/open5gs/upf-embb.yaml:ro
      - ./scripts/upf-embb-start.sh:/scripts/upf-embb-start.sh:ro
      - ./scripts/apply-slice-qos.sh:/scripts/apply-slice-qos.sh:ro
    restart: *restart_policy
    cpu_shares: 2048
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M

  upf-urllc:
    image: *open5gs_image
    container_name: upf-urllc
    profiles: ["core"]
    mem_limit: 384m
    cpus: 0.50
    user: root
    entrypoint: ["/bin/bash", "/scripts/upf-urllc-start.sh"]
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - IPV4_TUN_ADDR=10.46.0.1/16
      - IPV4_TUN_SUBNET=10.46.0.0/16
      - IPV6_TUN_ADDR=cafe::2/64
      - ENABLE_NAT=true
      - OGSTUN_TXQUEUELEN=512
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.101
    volumes:
      - ./config/upf-urllc.yaml:/opt/open5gs/etc/open5gs/upf-urllc.yaml:ro
      - ./scripts/upf-urllc-start.sh:/scripts/upf-urllc-start.sh:ro
      - ./scripts/apply-slice-qos.sh:/scripts/apply-slice-qos.sh:ro
    restart: *restart_policy
    cpu_shares: 2048
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M

  gnb:
    image: *ueransim_image
    container_name: gnb
    profiles: ["core"]
    mem_limit: 256m
    cpus: 0.35
    entrypoint: ["nr-gnb", "-c", "/mnt/ueransim/gnb.yaml"]
    networks:
      br-5gcore:
        ipv4_address: 172.20.1.10
    volumes:
      - ./config-ueransim:/mnt/ueransim
    cap_add:
      - NET_ADMIN
    depends_on:
      - amf
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 256M

  ue-embb:
    image: *ueransim_image
    container_name: ue-embb
    profiles: ["core"]
    mem_limit: 128m
    cpus: 0.20
    entrypoint: ["nr-ue", "-c", "/mnt/ueransim/ue-embb.yaml"]
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - br-5gcore
    volumes:
      - ./config-ueransim:/mnt/ueransim
    depends_on:
      - gnb
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M

  ue-urllc:
    image: *ueransim_image
    container_name: ue-urllc
    profiles: ["core"]
    mem_limit: 128m
    cpus: 0.20
    entrypoint: ["nr-ue", "-c", "/mnt/ueransim/ue-urllc.yaml"]
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - br-5gcore
    volumes:
      - ./config-ueransim:/mnt/ueransim
    depends_on:
      - gnb
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    profiles: ["monitoring"]
    mem_limit: 256m
    cpus: 0.20
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.210
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 256M

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    profiles: ["monitoring"]
    mem_limit: 256m
    cpus: 0.20
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.211
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 256M

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: pushgateway
    profiles: ["monitoring"]
    mem_limit: 64m
    cpus: 0.10
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.212
    ports:
      - "9091:9091"
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    profiles: ["heavy-monitoring"]
    mem_limit: 64m
    cpus: 0.10
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.213
    ports:
      - "9100:9100"
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    profiles: ["heavy-monitoring"]
    mem_limit: 128m
    cpus: 0.15
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.214
    privileged: true
    healthcheck:
      disable: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M

  webui:
    image: gradiant/open5gs-webui:2.7.5
    container_name: webui
    profiles: ["webui"]
    mem_limit: 128m
    cpus: 0.15
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - DB_URI=mongodb://mongo:27017/open5gs
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.200
    ports:
      - "9999:9999"
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M

  embb-iperf-server:
    image: networkstatic/iperf3:latest
    container_name: embb-iperf-server
    profiles: ["traffic"]
    mem_limit: 96m
    cpus: 0.20
    command: ["-s", "-p", "5201"]
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.221
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 96M

  urllc-iperf-server:
    image: networkstatic/iperf3:latest
    container_name: urllc-iperf-server
    profiles: ["traffic"]
    mem_limit: 64m
    cpus: 0.15
    command: ["-s", "-p", "5202"]
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.222
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 64M

  mqtt-server:
    image: eclipse-mosquitto:2.0.18
    container_name: mqtt-server
    profiles: ["traffic"]
    mem_limit: 64m
    cpus: 0.10
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.223
    ports:
      - "1883:1883"
    restart: *restart_policy
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
