networks:
  br-5gcore:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

services:
  mongo:
    image: mongo:6-jammy
    container_name: mongo
    restart: always
    command: ["mongod", "--bind_ip_all"]
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.5
    volumes:
      - ./mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' mongodb://127.0.0.1:27017/admin | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  nrf:
    image: gradiant/open5gs:2.7.5
    container_name: nrf
    command: open5gs-nrfd -c /opt/open5gs/etc/open5gs/nrf.yaml
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.10
    volumes:
      - ./config/nrf.yaml:/opt/open5gs/etc/open5gs/nrf.yaml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  amf:
    image: gradiant/open5gs:2.7.5
    container_name: amf
    command: open5gs-amfd -c /opt/open5gs/etc/open5gs/amf.yaml
    depends_on:
      - nrf
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.20
    volumes:
      - ./config/amf.yaml:/opt/open5gs/etc/open5gs/amf.yaml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  smf:
    image: gradiant/open5gs:2.7.5
    container_name: smf
    command: open5gs-smfd -c /opt/open5gs/etc/open5gs/smf.yaml
    depends_on:
      - nrf
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.30
    volumes:
      - ./config/smf.yaml:/opt/open5gs/etc/open5gs/smf.yaml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  ausf:
    image: gradiant/open5gs:2.7.5
    container_name: ausf
    command: open5gs-ausfd -c /opt/open5gs/etc/open5gs/ausf.yaml
    depends_on:
      - nrf
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.40
    volumes:
      - ./config/ausf.yaml:/opt/open5gs/etc/open5gs/ausf.yaml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  udm:
    image: gradiant/open5gs:2.7.5
    container_name: udm
    command: open5gs-udmd -c /opt/open5gs/etc/open5gs/udm.yaml
    depends_on:
      - nrf
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.50
    volumes:
      - ./config/udm.yaml:/opt/open5gs/etc/open5gs/udm.yaml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  udr:
    image: gradiant/open5gs:2.7.5
    container_name: udr
    command: open5gs-udrd -c /opt/open5gs/etc/open5gs/udr.yaml
    depends_on:
      - mongo
      - nrf
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.60
    volumes:
      - ./config/udr.yaml:/opt/open5gs/etc/open5gs/udr.yaml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  pcf:
    image: gradiant/open5gs:2.7.5
    container_name: pcf
    command: open5gs-pcfd -c /opt/open5gs/etc/open5gs/pcf.yaml
    depends_on:
      - nrf
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.70
    volumes:
      - ./config/pcf.yaml:/opt/open5gs/etc/open5gs/pcf.yaml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  upf-embb:
    image: gradiant/open5gs:2.7.5
    container_name: upf-embb
    user: root
    entrypoint: ["/bin/bash", "/scripts/upf-embb-start.sh"]
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - IPV4_TUN_ADDR=10.45.0.1/16
      - IPV4_TUN_SUBNET=10.45.0.0/16
      - IPV6_TUN_ADDR=cafe::1/64
      - ENABLE_NAT=true
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.100
    volumes:
      - ./config/upf-embb.yaml:/opt/open5gs/etc/open5gs/upf-embb.yaml:ro
      - ./scripts/upf-embb-start.sh:/scripts/upf-embb-start.sh:ro
      - ./scripts/apply-slice-qos.sh:/scripts/apply-slice-qos.sh:ro
    restart: unless-stopped
    cpu_shares: 4096
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  upf-urllc:
    image: gradiant/open5gs:2.7.5
    container_name: upf-urllc
    user: root
    entrypoint: ["/bin/bash", "/scripts/upf-urllc-start.sh"]
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - IPV4_TUN_ADDR=10.46.0.1/16
      - IPV4_TUN_SUBNET=10.46.0.0/16
      - IPV6_TUN_ADDR=cafe::2/64
      - ENABLE_NAT=true
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.101
    volumes:
      - ./config/upf-urllc.yaml:/opt/open5gs/etc/open5gs/upf-urllc.yaml:ro
      - ./scripts/upf-urllc-start.sh:/scripts/upf-urllc-start.sh:ro
      - ./scripts/apply-slice-qos.sh:/scripts/apply-slice-qos.sh:ro
    restart: unless-stopped
    cpu_shares: 3072
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.8'
          memory: 768M

  webui:
    image: gradiant/open5gs-webui:2.7.5
    container_name: webui
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - DB_URI=mongodb://mongo:27017/open5gs
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.200
    ports:
      - "9999:9999"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.210
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.211
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.213
    ports:
      - "9100:9100"
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.214
    privileged: true
    healthcheck:
      disable: true
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  gnb:
    image: gradiant/ueransim:3.2.6
    container_name: gnb
    entrypoint: ["nr-gnb", "-c", "/mnt/ueransim/gnb.yaml"]
    networks:
      br-5gcore:
        ipv4_address: 172.20.1.10
    volumes:
      - ./config-ueransim:/mnt/ueransim
    cap_add:
      - NET_ADMIN
    depends_on:
      - amf
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  ue-embb:
    image: gradiant/ueransim:3.2.6
    container_name: ue-embb
    entrypoint: ["nr-ue", "-c", "/mnt/ueransim/ue-embb.yaml"]
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    networks:
      - br-5gcore
    volumes:
      - ./config-ueransim:/mnt/ueransim
    depends_on:
      - gnb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  ue-urllc:
    image: gradiant/ueransim:3.2.6
    container_name: ue-urllc
    entrypoint: ["nr-ue", "-c", "/mnt/ueransim/ue-urllc.yaml"]
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    networks:
      - br-5gcore
    volumes:
      - ./config-ueransim:/mnt/ueransim
    depends_on:
      - gnb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.212
    ports:
      - "9091:9091"
    restart: unless-stopped

  embb-iperf-server:
    image: networkstatic/iperf3:latest
    container_name: embb-iperf-server
    command: ["-s", "-p", "5201"]
    networks:
      br-5gcore:
        ipv4_address: 172.20.0.221
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
